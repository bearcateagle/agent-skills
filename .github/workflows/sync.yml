name: Sync upstream skills

on:
  schedule:
    - cron: "0 9 * * 1" # Weekly on Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync pstack and mattpocock/skills
        run: bash ./scripts/sync-repo.sh

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain .agents SOURCES.json)" ]; then
            echo "No skill changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents SOURCES.json
          git commit -m "chore: sync upstream pstack and mattpocock skills"
          git push
